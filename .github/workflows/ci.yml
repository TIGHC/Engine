name: CI

# Runs the pytest suite on every push/PR (across OSes and supported Python
# versions), and - only when a `vX.Y.Z` tag is pushed (see commit.sh/
# commit.bat, which create that tag from VERSION.md) - builds a standalone
# GUI executable for Windows, Linux, and macOS with PyInstaller and attaches
# them to a GitHub Release. The release job depends on the test job passing
# on the exact commit being tagged, so a broken build is never published.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v

  build:
    name: Build executable (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux only - needed to bundle tkinter for the GUI build)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm tighc-gui.spec

      - name: Rename output binary
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION.md)"
          os_name="windows"
          ext=".exe"
          if [ "${{ runner.os }}" = "Linux" ]; then os_name="linux"; ext=""; fi
          if [ "${{ runner.os }}" = "macOS" ]; then os_name="macos"; ext=""; fi
          dest_name="TIGHC-${os_name}-v${version}${ext}"
          mv "dist/TIGHC${ext}" "dist/${dest_name}"
          echo "ASSET_PATH=dist/${dest_name}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: TIGHC-${{ runner.os }}
          path: ${{ env.ASSET_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless a job explicitly asks for
    # more - without this, softprops/action-gh-release fails with a 403
    # ("Resource not accessible by integration") trying to create the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
