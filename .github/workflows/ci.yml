name: CI

# Runs the pytest suite on every push/PR (across OSes and supported Python
# versions), and - only when a `vX.Y.Z` tag is pushed (see commit.sh/
# commit.bat, which create that tag from VERSION.md) - builds a standalone
# GUI executable for Windows, Linux, and macOS via src/build/create_release_files.py
# (the same script a contributor runs locally), zips assets/steam/ into
# TIGHC_Steam_Assets.zip and publishes it to the steam_assets branch, and
# attaches both to a GitHub Release. The release job depends on the build
# and steam-assets jobs, which both depend on the test job passing on the
# exact commit being tagged, so a broken build is never published.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v

  build:
    name: Build executable (${{ matrix.asset_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: windows
          - os: ubuntu-latest
            asset_name: linux
          - os: macos-latest
            asset_name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0

      - name: Build executable
        shell: bash
        run: python src/build/create_release_files.py

      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p dist_out
          if [ -f "dist/TIGHC.exe" ]; then
            cp "dist/TIGHC.exe" "dist_out/TIGHC-${{ matrix.asset_name }}.exe"
          elif [ -d "dist/TIGHC.app" ]; then
            # --windowed on macOS produces an app bundle, not a flat binary.
            zip -r -q "dist_out/TIGHC-${{ matrix.asset_name }}.zip" "dist/TIGHC.app"
          elif [ -f "dist/TIGHC" ]; then
            cp "dist/TIGHC" "dist_out/TIGHC-${{ matrix.asset_name }}"
          fi
          ls -la dist_out

      - uses: actions/upload-artifact@v4
        with:
          name: TIGHC-${{ matrix.asset_name }}
          path: dist_out/*

  steam-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build TIGHC_Steam_Assets.zip
        run: |
          mkdir -p dist_out
          cd assets/steam
          zip -r ../../dist_out/TIGHC_Steam_Assets.zip .

      - name: Publish to steam_assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan steam_assets
          git reset --hard
          cp dist_out/TIGHC_Steam_Assets.zip .
          git add TIGHC_Steam_Assets.zip
          git commit -m "Update Steam assets (${{ github.ref_name }})"
          git push origin steam_assets --force

      - uses: actions/upload-artifact@v4
        with:
          name: steam-assets
          path: dist_out/TIGHC_Steam_Assets.zip

  release:
    needs: [build, steam-assets]
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless a job explicitly asks for
    # more - without this, softprops/action-gh-release fails with a 403
    # ("Resource not accessible by integration") trying to create the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
